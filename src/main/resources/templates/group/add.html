<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჯგუფის დამატება</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>

<body>
<div th:replace="~{common/nav :: nav-bar}"></div>
<div class="container h-100 py-4 page-content">
    <div class="row justify-content-center align-items-center h-100">
        <div class="col-md-8 col-lg-6">
            <div class="card card-animated animate-fade-in-up">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">ახალი ჯგუფის დამატება</h2>
                    </div>

                    <form th:action="@{/groups/add}" th:object="${group}" method="post">
                        <div class="form-group mb-3">
                            <label for="code" class="form-label">ჯგუფის კოდი</label>
                            <input type="text" id="code" name="code" th:field="*{code}" class="form-control form-control-animated" required>
                            <p th:if="${#fields.hasErrors('code')}" th:errors="*{code}" class="text-danger"></p>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mt-4 btn-animated">დამატება</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
