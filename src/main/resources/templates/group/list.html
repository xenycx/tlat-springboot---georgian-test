<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჯგუფების ჩამონათვალი</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>

<body>
<div th:replace="~{common/nav :: nav-bar}"></div>
<div class="container py-4 page-content">
    <div class="d-flex justify-content-between align-items-center mb-4 animate-fade-in-down">
        <h2 class="fw-bold">
            <i class="ri-stack-fill icon-animated"></i> ჯგუფების ჩამონათვალი
        </h2>
        <a href="/groups/add" class="btn btn-primary btn-animated" sec:authorize="hasRole('ADMIN')">
            <i class="ri-add-circle-line"></i> ჯგუფის დამატება
        </a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-animated">
        <p th:text="${errorMessage}" class="mb-0"></p>
    </div>

    <div class="card card-animated animate-fade-in-up">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 table-animated">
                    <thead class="table-dark">
                    <tr>
                        <th class="d-none d-md-table-cell">ID</th>
                        <th>ჯგუფის კოდი</th>
                        <th sec:authorize="hasRole('ADMIN')">მოქმედება</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="group : ${groups}">
                        <td class="d-none d-md-table-cell" th:text="${group.id}"></td>
                        <td th:text="${group.code}"></td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <div class="action-buttons">
                                <a th:href="@{/groups/edit/{id}(id=${group.id})}" class="btn btn-primary btn-sm btn-animated">
                                    <i class="ri-pencil-line"></i><span class="d-none d-lg-inline"> რედაქტირება</span>
                                </a>
                                <a th:href="@{/groups/delete/{id}(id=${group.id})}" class="btn btn-danger btn-sm btn-animated">
                                    <i class="ri-delete-bin-line"></i><span class="d-none d-lg-inline"> წაშლა</span>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
