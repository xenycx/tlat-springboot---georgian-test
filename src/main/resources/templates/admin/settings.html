<!DOCTYPE html>
<html lang="ka" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პარამეტრები</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
    <style>
        .setting-card {
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .setting-key {
            font-family: monospace;
            font-size: 0.8rem;
            color: #aaaaaa;
        }
        .setting-description {
            font-size: 0.875rem;
            color: #bbbbbb;
        }
        .form-control, .form-control:focus {
            background-color: #1e1e1e;
            border-color: #555555;
            color: #e1e1e1;
        }
        .form-control:focus {
            border-color: #bb86fc;
            box-shadow: 0 0 0 0.2rem rgba(187, 134, 252, 0.25);
        }
    </style>
</head>
<body>
    <div th:replace="~{common/nav :: nav-bar}"></div>

    <div class="container py-4 page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 animate-fade-in-down">
            <h2 class="fw-bold">
                <i class="ri-settings-4-fill icon-animated"></i> სისტემის პარამეტრები
            </h2>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-animated">
            <i class="ri-alert-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success alert-animated">
            <i class="ri-checkbox-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/admin/settings}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- File Upload Settings -->
            <div class="card card-animated animate-fade-in-up mb-4">
                <div class="card-header d-flex align-items-center gap-2">
                    <i class="ri-cloud-upload-fill text-primary"></i>
                    <strong>ფაილების ატვირთვა</strong>
                </div>
                <div class="card-body">
                    <div th:each="setting : ${settings}"
                         th:if="${setting.key == 'lecturer.max.file.size.mb'}"
                         class="row align-items-center setting-card p-3">
                        <div class="col-md-7 mb-2 mb-md-0">
                            <div class="fw-semibold" th:text="${setting.description}">აღწერა</div>
                            <div class="setting-key mt-1" th:text="${setting.key}"></div>
                        </div>
                        <div class="col-md-5">
                            <div class="input-group">
                                <input type="number"
                                       class="form-control"
                                       th:name="${setting.key}"
                                       th:value="${setting.value}"
                                       min="1"
                                       max="1024"
                                       required>
                                <span class="input-group-text" style="background:#1e1e1e;color:#aaa;border-color:#555">MB</span>
                            </div>
                            <div class="setting-description mt-1">მინიმუმი: 1 MB, მაქსიმუმი: 1024 MB</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Grading Settings -->
            <div class="card card-animated animate-fade-in-up mb-4">
                <div class="card-header d-flex align-items-center gap-2">
                    <i class="ri-file-chart-fill text-warning"></i>
                    <strong>შეფასების სისტემა</strong>
                </div>
                <div class="card-body">
                    <div th:each="setting : ${settings}"
                         th:if="${#strings.startsWith(setting.key, 'grading.')}"
                         class="row align-items-center setting-card p-3">
                        <div class="col-md-7 mb-2 mb-md-0">
                            <div class="fw-semibold" th:text="${setting.description}">აღწერა</div>
                            <div class="setting-key mt-1" th:text="${setting.key}"></div>
                        </div>
                        <div class="col-md-5">
                            <div class="input-group">
                                <input type="number"
                                       class="form-control"
                                       th:name="${setting.key}"
                                       th:value="${setting.value}"
                                       min="1"
                                       max="100"
                                       required>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Future settings sections can be added here as new cards -->

            <div class="d-flex gap-2 mt-2">
                <button type="submit" class="btn btn-primary btn-animated">
                    <i class="ri-save-3-fill me-1"></i> შენახვა
                </button>
                <a th:href="@{/main}" class="btn btn-outline-secondary btn-animated">
                    <i class="ri-close-circle-line me-1"></i> გაუქმება
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
