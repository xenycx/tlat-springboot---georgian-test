<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ლექციის დამატება</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
    <style>
        .badge {
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div th:replace="~{common/nav :: nav-bar}"></div>
    <div class="container h-100 py-4 page-content">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-md-8 col-lg-6">
                <div class="card card-animated animate-fade-in-up">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">ახალი ლექციის დატამება</h2>
                            <p class="text-muted">დაგეგმე ლექცია</p>
                        </div>
                        
                        <form th:action="@{/lectures/add}" th:object="${lecture}" method="post">
                            <div class="form-group mb-3">
                                <label for="roomNumber" class="form-label">ოთახი</label>
                                <select class="form-select form-select-animated" id="roomNumber" name="roomNumber" th:field="*{roomNumber}" required>
                                    <option value="">აირჩიე ოთახი</option>
                                    <option th:each="room : ${rooms}" th:value="${room.roomNumber}" th:text="${room.roomNumber}"></option>
                                </select>
                                <p th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}" class="text-danger"></p>
                            </div>

                            <div class="form-group mb-3">
                                <label for="date" class="form-label">თარიღი</label>
                                <input type="date" class="form-control form-control-animated" id="date" name="date" th:field="*{date}" required>
                                <p th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="text-danger"></p>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group mb-3">
                                        <label for="startTime" class="form-label">დაწყების დრო</label>
                                        <input type="time" class="form-control form-control-animated" id="startTime" name="startTime" th:field="*{startTime}" required>
                                        <p th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}" class="text-danger"></p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group mb-3">
                                        <label for="endTime" class="form-label">დასრულების დრო</label>
                                        <input type="time" class="form-control form-control-animated" id="endTime" name="endTime" th:field="*{endTime}" required>
                                        <p th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}" class="text-danger"></p>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group mb-3">
                                <label for="lecturer" class="form-label">ლექტორი</label>
                                <select class="form-select form-select-animated" id="lecturer" name="lecturer" th:field="*{lecturer}" required>
                                    <option value="">აირჩიე ლექტორი</option>
                                    <option th:each="user : ${users}" 
                                            th:value="${user.firstName + ' ' + user.lastName}" 
                                            th:text="${user.firstName + ' ' + user.lastName}">
                                    </option>
                                </select>
                                <p th:if="${#fields.hasErrors('lecturer')}" th:errors="*{lecturer}" class="text-danger"></p>
                            </div>

                            <div class="form-group mb-3">
                                <label for="subject" class="form-label">საგანი</label>
                                <input type="text" class="form-control form-control-animated" id="subject" name="subject" th:field="*{subject}" required>
                                <p th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}" class="text-danger"></p>
                            </div>

                            <div class="form-group mb-3">
                                <label for="status" class="form-label">სტატუსი</label>
                                <select class="form-select form-select-animated" id="status" name="status" th:field="*{status}" required>
                                    <option value="">აირჩიე სტატუსი</option>
                                    <option th:each="status : ${T(com.tlat.Entity.LectureStatus).values()}"
                                            th:value="${status}" 
                                            th:text="${status}">
                                    </option>
                                </select>
                                <p th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-danger"></p>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mt-4 btn-animated">დამატება</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
