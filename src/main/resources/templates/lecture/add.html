<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ლექციის დამატება</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
    <style>
        .badge {
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 500;
        }
        .selection-panel {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--dark-border);
            border-radius: 14px;
            padding: 1rem;
            max-height: 240px;
            overflow-y: auto;
        }
        .selection-item {
            position: relative;
        }
        .selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
        }
        .selection-search {
            margin-bottom: 0.9rem;
        }
        .selection-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .selection-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            min-height: 64px;
            padding: 0.9rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            color: var(--dark-text);
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }
        .selection-label:hover {
            border-color: rgba(13, 110, 253, 0.45);
            transform: translateY(-1px);
        }
        .selection-label::after {
            content: '';
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background-color: transparent;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .selection-input:checked + .selection-label {
            border-color: rgba(13, 110, 253, 0.75);
            background: linear-gradient(135deg, rgba(13, 110, 253, 0.18), rgba(13, 110, 253, 0.08));
            box-shadow: 0 0 0 1px rgba(13, 110, 253, 0.2);
        }
        .selection-input:checked + .selection-label::after {
            background-color: #0d6efd;
            border-color: #0d6efd;
            box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.92);
        }
        .selection-text {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .selection-title {
            font-weight: 600;
        }
        .selection-subtitle {
            font-size: 0.85rem;
            color: var(--dark-text-muted, rgba(255, 255, 255, 0.65));
        }
    </style>
</head>

<body>
    <div th:replace="~{common/nav :: nav-bar}"></div>
    <div class="container py-4 page-content">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="card card-animated animate-fade-in-up">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">ახალი ლექციის დატამება</h2>
                            <p class="text-muted">დაგეგმე ლექცია</p>
                        </div>

                        <div th:if="${errorMessage}" class="alert alert-danger">
                            <p th:text="${errorMessage}" class="mb-0"></p>
                        </div>

                        <form th:action="@{/lectures/add}" th:object="${lecture}" method="post">
                            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                                <p class="mb-2">ფორმა ვერ შეინახა. შეასწორე ველები:</p>
                                <ul class="mb-0 ps-3">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                                </ul>
                            </div>

                            <div class="form-group mb-3">
                                <label for="roomNumber" class="form-label">ოთახი</label>
                                <select class="form-select form-select-animated" id="roomNumber" name="roomNumber" th:field="*{roomNumber}" required>
                                    <option value="">აირჩიე ოთახი</option>
                                    <option th:each="room : ${rooms}" th:value="${room.roomNumber}" th:text="${room.roomNumber}"></option>
                                </select>
                                <p th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}" class="text-danger"></p>
                            </div>

                            <div class="form-group mb-3">
                                <label for="date" class="form-label">თარიღი</label>
                                <input type="date" class="form-control form-control-animated" id="date" name="date" th:field="*{date}" required>
                                <p th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="text-danger"></p>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group mb-3">
                                        <label for="startTime" class="form-label">დაწყების დრო</label>
                                        <input type="time" class="form-control form-control-animated" id="startTime" name="startTime" th:field="*{startTime}" required>
                                        <p th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}" class="text-danger"></p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group mb-3">
                                        <label for="endTime" class="form-label">დასრულების დრო</label>
                                        <input type="time" class="form-control form-control-animated" id="endTime" name="endTime" th:field="*{endTime}" required>
                                        <p th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}" class="text-danger"></p>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group mb-3">
                                <label class="form-label">ლექტორები</label>
                                <div class="selection-panel">
                                    <div th:if="${#lists.isEmpty(users)}" class="text-muted">ლექტორები ვერ მოიძებნა</div>
                                    <input th:unless="${#lists.isEmpty(users)}"
                                           type="search"
                                           class="form-control form-control-animated selection-search"
                                           placeholder="მოძებნე ლექტორი"
                                           data-filter-input
                                           data-filter-target="lecturer-selection">
                                    <div th:unless="${#lists.isEmpty(users)}" class="selection-grid">
                                        <div th:each="user : ${users}" class="selection-item" data-filter-item="lecturer-selection" th:attr="data-filter-value=${user.name}">
                                            <input class="selection-input"
                                               type="checkbox"
                                               th:field="*{lecturerIds}"
                                               th:value="${user.id}"
                                               th:id="${'lecturer-' + user.id}">
                                            <label class="selection-label" th:for="${'lecturer-' + user.id}">
                                                <span class="selection-text">
                                                    <span class="selection-title" th:text="${user.name}"></span>
                                                    <span class="selection-subtitle">ლექტორი</span>
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-text text-muted">მონიშნე მინიმუმ ერთი ლექტორი</div>
                                <p th:if="${#fields.hasErrors('lecturerIds')}" th:errors="*{lecturerIds}" class="text-danger"></p>
                            </div>

                            <div class="form-group mb-3">
                                <label class="form-label">ჯგუფები</label>
                                <div class="selection-panel">
                                    <div th:if="${#lists.isEmpty(groups)}" class="text-muted">ჯგუფები ვერ მოიძებნა</div>
                                    <input th:unless="${#lists.isEmpty(groups)}"
                                           type="search"
                                           class="form-control form-control-animated selection-search"
                                           placeholder="მოძებნე ჯგუფი"
                                           data-filter-input
                                           data-filter-target="group-selection">
                                    <div th:unless="${#lists.isEmpty(groups)}" class="selection-grid">
                                        <div th:each="group : ${groups}" class="selection-item" data-filter-item="group-selection" th:attr="data-filter-value=${group.code}">
                                            <input class="selection-input"
                                               type="checkbox"
                                               th:field="*{groupIds}"
                                               th:value="${group.id}"
                                               th:id="${'group-' + group.id}">
                                            <label class="selection-label" th:for="${'group-' + group.id}">
                                                <span class="selection-text">
                                                    <span class="selection-title" th:text="${group.code}"></span>
                                                    <span class="selection-subtitle">სტუდენტური ჯგუფი</span>
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-text text-muted">მონიშნე მინიმუმ ერთი ჯგუფი</div>
                                <p th:if="${#fields.hasErrors('groupIds')}" th:errors="*{groupIds}" class="text-danger"></p>
                            </div>

                            <div class="form-group mb-3">
                                <label for="subject" class="form-label">საგანი</label>
                                <input type="text" class="form-control form-control-animated" id="subject" name="subject" th:field="*{subject}" required>
                                <p th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}" class="text-danger"></p>
                            </div>

                            <div class="form-group mb-3">
                                <label for="status" class="form-label">სტატუსი</label>
                                <select class="form-select form-select-animated" id="status" name="status" th:field="*{status}" required>
                                    <option value="">აირჩიე სტატუსი</option>
                                    <option th:each="status : ${T(com.tlat.Entity.LectureStatus).values()}"
                                            th:value="${status}" 
                                            th:text="${status}">
                                    </option>
                                </select>
                                <p th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-danger"></p>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mt-4 btn-animated">დამატება</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script>
        document.querySelectorAll('[data-filter-input]').forEach(function (input) {
            input.addEventListener('input', function () {
                var target = input.getAttribute('data-filter-target');
                var query = input.value.trim().toLowerCase();
                document.querySelectorAll('[data-filter-item="' + target + '"]').forEach(function (item) {
                    var value = (item.getAttribute('data-filter-value') || '').toLowerCase();
                    item.style.display = !query || value.includes(query) ? '' : 'none';
                });
            });
        });
    </script>
</body>

</html>
