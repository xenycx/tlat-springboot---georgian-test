<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ახალი რესურსი</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>
<body>
<div th:replace="~{common/nav :: nav-bar}"></div>
<div class="container py-4 page-content">
    <div class="row justify-content-center animate-fade-in-up">
        <div class="col-lg-8">
            <div class="card card-animated">
                <div class="card-body p-4">
                    <h3 class="mb-4"><i class="ri-upload-2-line"></i> ახალი რესურსის ატვირთვა</h3>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/resources/add}" method="post" enctype="multipart/form-data" th:object="${resourceForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label">ლექცია</label>
                            <select class="form-select form-select-animated" th:field="*{lectureId}">
                                <option value="">აირჩიეთ ლექცია</option>
                                <option th:each="lecture : ${lectures}"
                                        th:value="${lecture.id}"
                                    th:text="${lecture.subject + ' | ' + lecture.lecturer}"></option>
                            </select>
                            <small class="text-danger" th:if="${#fields.hasErrors('lectureId')}" th:errors="*{lectureId}"></small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">სათაური</label>
                            <input class="form-control form-control-animated" th:field="*{title}">
                            <small class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">აღწერა</label>
                            <textarea class="form-control form-control-animated" th:field="*{description}" rows="3"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">კატეგორია</label>
                                <select class="form-select form-select-animated" th:field="*{category}">
                                    <option value="MATERIAL">სასწავლო მასალა</option>
                                    <option value="HOMEWORK">საშინაო დავალება</option>
                                    <option value="OTHER">სხვა</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3 d-flex align-items-end">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" th:field="*{published}">
                                    <label class="form-check-label">დაუყოვნებლივ გამოქვეყნება</label>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">ხილვადობის დაწყება (არასავალდებულო)</label>
                                <input type="datetime-local" class="form-control form-control-animated" th:field="*{visibleFrom}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">ხილვადობის დასრულება (არასავალდებულო)</label>
                                <input type="datetime-local" class="form-control form-control-animated" th:field="*{visibleUntil}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">ფაილი</label>
                            <input type="file" class="form-control form-control-animated" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.zip" required>
                            <div class="form-text">ლექტორისთვის მაქსიმუმ 100MB. დაშვებულია PDF, DOC, DOCX, PPT, PPTX, ZIP.</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-animated">შენახვა</button>
                            <a href="/resources" class="btn btn-secondary btn-animated">გაუქმება</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
