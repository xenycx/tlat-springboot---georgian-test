<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>მოხმარებელი :: რედაქტირება</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>

<body>
    <div th:replace="~{common/nav :: nav-bar}"></div>
    
    <div class="container py-5 page-content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow card-animated animate-fade-in-up">
                        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show alert-animated" role="alert">
                            პროფილი წარმატებით განახლდა!
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        
                        <form method="post" role="form" th:action="@{/edit/{userId}(userId=${user.id})}" th:object="${user}" enctype="multipart/form-data">
                            <div th:replace="~{common/userForm :: login-form}"></div>
                            <div class="form-group text-center">
                                <button class="btn btn-primary btn-lg btn-animated" type="submit">რედაქტირება</button>
                            </div>
                        </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
