<div th:fragment="nav-bar">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
    <style>
        /* მომხმარებლის ავატარის სტილები */
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--dark-primary, #bb86fc);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .user-avatar:hover {
            transform: scale(1.05);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(187, 134, 252, 0.5);
        }
        
        /* მომხმარებლის ავატარის ჩამოსაშლელი მენიუ */
        .avatar-dropdown {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .avatar-dropdown-toggle {
            display: none;
        }
        .avatar-dropdown-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .avatar-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 220px;
            background: #121212 !important;
            background-color: #121212 !important;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.25s ease;
            overflow: hidden;
        }
        .avatar-dropdown-toggle:checked ~ .avatar-dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .avatar-dropdown-item {
            display: flex;
            align-items: center;
            color: var(--dark-text, #e1e1e1);
            padding: 0.85rem 1.25rem;
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            background: transparent;
            border-top: 0;
            border-right: 0;
            border-bottom: 0;
            width: 100%;
            text-align: left;
            font: inherit;
            cursor: pointer;
        }
        .avatar-dropdown-item:hover {
            background: var(--dark-hover, rgba(187, 134, 252, 0.1));
            color: var(--dark-primary, #bb86fc);
            border-left-color: var(--dark-primary, #bb86fc);
        }
        .avatar-dropdown-item i {
            margin-right: 12px;
            width: 18px;
            text-align: center;
        }
        .user-name-header {
            background: #1e1e1e !important;
            background-color: #1e1e1e !important;
            color: #e1e1e1;
            font-weight: 500;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #333333;
        }
        .user-name-header .avatar-small {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--dark-primary, #bb86fc);
        }
        .logout-item {
            color: #ef5350 !important;
            border-top: 1px solid var(--dark-border, #333333);
        }
        .logout-item:hover {
            background: rgba(239, 83, 80, 0.15) !important;
            color: #ef5350 !important;
            border-left-color: #ef5350 !important;
        }
        
        /* ნავიგაციის ზოლის სპეციფიკური სტილები */
        .navbar-toggler {
            border-color: var(--dark-border, #333333) !important;
            padding: 6px 10px;
        }
        .navbar-toggler:focus {
            box-shadow: 0 0 0 0.2rem rgba(187, 134, 252, 0.25);
        }
        
        /* მარჯვენა მხარის კონტეინერი */
        .navbar-right-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* დესკტოპ ნავიგაციის ლინკების ლეიბლები დამალულია */
        .nav-link-label {
            display: none;
        }
        
        /* მობილური IP ინფორმაციის ჩვენება ნაგულისხმევად დამალულია */
        .mobile-ip-info {
            display: none;
        }
        
        /* ===== MOBILE STYLES ===== */
        @media (max-width: 991.98px) {
            /* ნავიგაციის ზოლის განლაგება */
            .navbar > .container-fluid {
                flex-wrap: nowrap;
            }
            
            /* ჰამბურგერი და ავატარი გვერდიგვერდ */
            .navbar-right-container {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-left: auto;
            }
            
            /* ავატარისთვის უფრო დიდი შეხების ზონა */
            .user-avatar {
                width: 44px;
                height: 44px;
            }
            
            /* ჩამოსაშლელი მენიუს პოზიციონირება მობილურზე - მყარი ფონი */
            .avatar-dropdown-menu {
                position: fixed;
                top: 70px;
                right: 10px;
                left: auto;
                width: calc(100vw - 20px);
                max-width: 300px;
                background: #121212 !important;
                background-color: #121212 !important;
            }
            
            /* უფრო დიდი ჩამოსაშლელი ელემენტები შეხებისთვის */
            .avatar-dropdown-item {
                padding: 1rem 1.25rem;
                min-height: 50px;
                background-color: transparent;
            }
            
            /* კოლაფსირებული მენიუს სტილიზაცია - მყარი ფონი */
            .navbar-collapse {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #1e1e1e !important;
                background-color: #1e1e1e !important;
                border: 1px solid #333333;
                border-radius: 0 0 8px 8px;
                padding: 10px;
                margin: 0;
                z-index: 1000;
            }
            
            /* ნავიგაციის ლინკები მობილურ მენიუში */
            .navbar-nav .nav-link {
                padding: 14px 16px !important;
                border-radius: 6px;
                margin: 4px 0;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            
            .navbar-nav .nav-link:hover,
            .navbar-nav .nav-link:active {
                background: var(--dark-hover, rgba(187, 134, 252, 0.1));
            }
            
            /* მობილურ მენიუში ლეიბლების ჩვენება */
            .nav-link-label {
                display: inline !important;
                font-size: 1rem;
            }
            
            /* IP ინფორმაციის ჩვენება მობილურ მენიუში */
            .mobile-ip-info {
                display: block !important;
                padding: 12px 16px;
                border-top: 1px solid var(--dark-border, #333333);
                margin-top: 10px;
            }
            
            .mobile-ip-info .ip-container {
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .mobile-ip-info .ip-badge,
            .mobile-ip-info .room-badge {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
    <div class="nav-wrapper" th:with="navUser=${currentUser != null ? currentUser : user}">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid position-relative">
                <!-- ბრენდი (მარცხენა მხარე) -->
                <a class="navbar-brand" th:href="@{/main}">
                    <i class="bi bi-house-fill"></i> მთავარი
                </a>
                
                <!-- ჰამბურგერის ტოგლერი (მობილურისთვის მხოლოდ) - ბრენდის შემდეგ ჩანს მობილურზე -->
                <button class="navbar-toggler order-lg-3" type="button" data-bs-toggle="collapse" 
                        data-bs-target="#navbarNav" 
                        aria-controls="navbarNav" 
                        aria-expanded="false" 
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- კოლაფსირებადი ნავიგაცია (დესკტოპზე მარცხენა მხარეს) -->
                <div class="collapse navbar-collapse order-lg-1" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link active" th:href="@{/users}">
                                <i class="bi bi-people-fill"></i>
                                <span class="nav-link-label">მომხმარებლები</span>
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','LECTURER')">
                            <a class="nav-link active" th:href="@{/rooms}">
                                <i class="bi bi-door-closed-fill"></i>
                                <span class="nav-link-label">ოთახები</span>
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link active" th:href="@{/groups}">
                                <i class="bi bi-collection-fill"></i>
                                <span class="nav-link-label">ჯგუფები</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/lectures}">
                                <i class="bi bi-book-fill"></i>
                                <span class="nav-link-label">ლექციები</span>
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','LECTURER')">
                            <a class="nav-link active" th:href="@{/grading/hub}">
                                <i class="bi bi-star-fill"></i>
                                <span class="nav-link-label">შეფასება</span>
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','LECTURER')">
                            <a class="nav-link active" th:href="@{/resources}">
                                <i class="bi bi-folder-fill"></i>
                                <span class="nav-link-label">რესურსები</span>
                            </a>
                        </li>
                    </ul>
                    
                    <!-- IP ინფორმაცია მობილურ მენიუში -->
                    <div class="mobile-ip-info">
                        <div class="ip-container">
                            <div class="ip-badge">
                                <i class="bi bi-pc-display"></i>
                                <span id="currentIpMobile">Loading IP...</span>
                            </div>
                            <div class="room-badge" id="roomInfoMobile" style="display: none">
                                <i class="bi bi-door-open"></i>
                                <span id="roomNumberMobile"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ცენტრი - IP მისამართი (მხოლოდ დესკტოპზე) -->
                <div class="navbar-center d-none d-lg-flex order-lg-2">
                    <div class="ip-container">
                        <div class="ip-badge badge-pulse">
                            <i class="bi bi-pc-display"></i>
                            <span id="currentIp">Loading IP...</span>
                        </div>
                        <div class="room-badge animate-fade-in" id="roomInfo" style="display: none">
                            <i class="bi bi-door-open"></i>
                            <span id="roomNumber"></span>
                        </div>
                    </div>
                </div>

                <!-- ავატარი (დესკტოპზე მარჯვენა მხარეს) -->
                 <div class="navbar-right-container order-lg-4">
                    <div class="avatar-dropdown" th:if="${navUser != null}">
                        <input type="checkbox" id="avatarDropdownToggle" class="avatar-dropdown-toggle">
                        <label for="avatarDropdownToggle" class="avatar-dropdown-btn">
                           <img th:if="${navUser.avatarPath != null}" 
                               th:src="@{'/avatars/' + ${navUser.avatarPath}}" 
                                 alt="Avatar" class="user-avatar avatar-animated">
                           <img th:if="${navUser.avatarPath == null}" 
                                 th:src="@{/images/default-avatar.svg}" 
                                 alt="Avatar" class="user-avatar avatar-animated">
                        </label>
                        <div class="avatar-dropdown-menu">
                            <div class="user-name-header">
                              <img th:if="${navUser.avatarPath != null}" 
                                  th:src="@{'/avatars/' + ${navUser.avatarPath}}" 
                                     alt="Avatar" class="avatar-small">
                              <img th:if="${navUser.avatarPath == null}" 
                                     th:src="@{/images/default-avatar.svg}" 
                                     alt="Avatar" class="avatar-small">
                              <span th:text="${navUser.name}"></span>
                            </div>
                            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/settings}" class="avatar-dropdown-item">
                                <i class="bi bi-gear-fill"></i> პარამეტრები
                            </a>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="avatar-dropdown-item logout-item">
                                    <i class="bi bi-box-arrow-right"></i> გასვლა
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </div>

    <script>
        function hideRoomInfo() {
            ['roomInfo', 'roomInfoMobile'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
        }

        function isValidIp(ip) {
            const ipv4Regex = /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/;
            return ipv4Regex.test(ip) || ip === '::1' || ip === '0:0:0:0:0:0:0:1';
        }

        async function updateIpAndRoom() {
            try {
                const response = await fetch('/rooms/ip');
                if (!response.ok) {
                    throw new Error(`Failed to fetch IP: ${response.status}`);
                }
                const ip = (await response.text()).trim();
                if (!isValidIp(ip)) {
                    console.warn('Invalid IP response from /rooms/ip');
                    hideRoomInfo();
                    return;
                }
                
                // IP განახლება როგორც დესკტოპზე, ასევე მობილურზე
                const ipElements = ['currentIp', 'currentIpMobile'];
                ipElements.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = ip;
                });

                // შემოწმება, არის თუ არა ეს IP დაკავშირებული ოთახთან
                const roomResponse = await fetch(`/rooms/find-by-ip?ip=${encodeURIComponent(ip)}`);
                if (roomResponse.ok) {
                    const roomData = await roomResponse.json();
                    const roomElements = [
                        { number: 'roomNumber', info: 'roomInfo' },
                        { number: 'roomNumberMobile', info: 'roomInfoMobile' }
                    ];
                    
                    roomElements.forEach(({ number, info }) => {
                        const numEl = document.getElementById(number);
                        const infoEl = document.getElementById(info);
                        if (roomData && roomData.roomNumber) {
                            if (numEl) numEl.textContent = roomData.roomNumber;
                            if (infoEl) infoEl.style.display = 'inline-block';
                        } else {
                            if (infoEl) infoEl.style.display = 'none';
                        }
                    });
                } else {
                    hideRoomInfo();
                }
            } catch (error) {
                console.error('Error fetching IP or room:', error);
                const ipElements = ['currentIp', 'currentIpMobile'];
                ipElements.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = 'Error loading IP';
                });
                hideRoomInfo();
            }
        }

        // გვერდის ჩატვირთვისას IP და ოთახის ინფორმაციის განახლება
        updateIpAndRoom();

        // ყოველ წუთში განახლება
        setInterval(updateIpAndRoom, 60000);
        
        // ავატარის ჩამოსაშლელი მენიუს დახურვა, როდესაც გარეთ დავაჭერთ
        document.addEventListener('click', function(e) {
            var toggle = document.getElementById('avatarDropdownToggle');
            var dropdown = document.querySelector('.avatar-dropdown');
            if (toggle && dropdown && !dropdown.contains(e.target)) {
                toggle.checked = false;
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</div>
