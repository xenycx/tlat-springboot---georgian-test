<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მომხმარებლის დამატება</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>

<body>
    <div th:replace="~{common/nav :: nav-bar}"></div>
    <div class="container h-100 py-4 page-content">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-md-8 col-lg-6">
                <div th:if="${param.success}" class="alert alert-success mb-4 alert-animated">
                    ახალი მომხმარებელი წარმატებით დაემატა.
                </div>

                <form method="post" role="form" th:action="@{/add/save}" th:object="${user}" enctype="multipart/form-data" class="animate-fade-in-up">
                    <div th:replace="~{common/userForm :: login-form}"></div>
                    
                    <div class="text-center mt-4">
                        <button class="btn btn-primary w-100 py-2 btn-animated" type="submit">დამატება</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function togglePasswordRequired() {
            var roleSelect = document.getElementById("role");
            var passwordField = document.getElementById("password");
            
            if (roleSelect && roleSelect.value === 'ROLE_STUDENT') {
                passwordField.required = false;
                passwordField.placeholder = "პაროლი აღარ არის სავალდებულო სტუდენტებისთვის...";
            } else {
                passwordField.required = true;
                passwordField.placeholder = "შეიყვანეთ პაროლი...";
            }
        }

        function initForm() {
            var roleSelect = document.getElementById("role");
            if (roleSelect) {
                roleSelect.addEventListener('change', togglePasswordRequired);
            }
            togglePasswordRequired();
        }
        
        window.onload = initForm;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
