<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ოთახების ჩამონათვალი</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>

<body>
    <div th:replace="~{common/nav :: nav-bar}"></div>
    <div class="container py-4 page-content">
        <div class="d-flex justify-content-between align-items-center mb-4 animate-fade-in-down">
            <h2 class="fw-bold">
                <i class="bi bi-door-closed-fill icon-animated"></i> ოთახების ჩამონათვალი
            </h2>
            <a href="/rooms/add" class="btn btn-primary btn-animated" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-plus-circle"></i> ოთახის დამატება
            </a>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-animated">
            <p th:text="${errorMessage}" class="mb-0"></p>
        </div>
    
        <div th:if="${successMessage}" class="alert alert-success alert-animated">
            <p th:text="${successMessage}" class="mb-0"></p>
        </div>

        <div class="card card-animated animate-fade-in-up">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 table-animated">
                    <thead class="table-dark">
                        <tr>
                            <th class="d-none d-md-table-cell">ID</th>
                            <th>ოთახის ნომერი</th>
                            <th class="d-none d-sm-table-cell">IP მისამართი</th>
                            <th sec:authorize="hasRole('ADMIN')">მოქმედება</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="room : ${rooms}">
                            <td class="d-none d-md-table-cell" th:text="${room.id}"></td>
                            <td th:text="${room.roomNumber}"></td>
                            <td class="d-none d-sm-table-cell" th:text="${room.ipAddress}"></td>
                            <td sec:authorize="hasRole('ADMIN')">
                                <div class="action-buttons">
                                    <a th:href="@{/rooms/edit/{id}(id=${room.id})}" class="btn btn-primary btn-sm btn-animated" title="რედაქტირება">
                                        <i class="bi bi-pencil"></i><span class="d-none d-lg-inline"> რედაქტირება</span>
                                    </a>
                                    <a th:href="@{/rooms/delete/{id}(id=${room.id})}" class="btn btn-danger btn-sm btn-animated" title="წაშლა">
                                        <i class="bi bi-trash"></i><span class="d-none d-lg-inline"> წაშლა</span>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ანიმაცია ყველა table-ის ველისთვის
        document.addEventListener('DOMContentLoaded', function() {
            const tableRows = document.querySelectorAll('.table-animated tbody tr');
            tableRows.forEach((row, index) => {
                row.style.animationDelay = (index * 0.05) + 's';
            });
        });
    </script>
</body>
</html>
