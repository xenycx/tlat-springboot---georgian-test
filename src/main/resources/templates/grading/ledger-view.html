<!DOCTYPE html>
<html lang="ka" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ნიშნების უწყისი</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
    <style>
        .table-input {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            width: 100%;
            text-align: right;
        }
        .table-input:focus {
            outline: none;
            border-color: #bb86fc;
            background-color: #333;
        }
    </style>
</head>
<body>
<div th:replace="~{common/nav :: nav-bar}"></div>

<div class="container py-4 page-content">
    <div th:if="${errorMessage}" class="alert alert-danger alert-animated">
        <p th:text="${errorMessage}" class="mb-0"></p>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-animated">
        <p th:text="${successMessage}" class="mb-0"></p>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 animate-fade-in-down">
        <div>
            <h2 class="fw-bold">
                <i class="bi bi-file-earmark-spreadsheet icon-animated"></i> ნიშნების უწყისი
            </h2>
            <p class="text-muted mb-0">
                საგანი: <span th:text="${subject}"></span> |
                ჯგუფი: <span th:text="${group != null ? group.code : ''}"></span>
            </p>
        </div>
        <a th:href="@{/grading/ledger}" class="btn btn-outline-secondary btn-animated">
            <i class="bi bi-arrow-left"></i> უკან დაბრუნება
        </a>
    </div>

    <div class="card card-animated animate-fade-in-up">
        <div class="card-body">
            <form th:action="@{/grading/ledger/save}" th:object="${form}" method="post">
                <input type="hidden" th:field="*{subject}" />
                <input type="hidden" th:field="*{groupId}" />
                
                <div class="table-responsive">
                    <table class="table table-dark table-striped table-hover align-middle mb-4">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>სტუდენტი</th>
                                <th class="text-end">დასწრება/აქტივობა (<span th:text="${maxAttendance}"></span>)</th>
                                <th class="text-end" style="width: 150px;">შუალედური (<span th:text="${maxMidterm}"></span>)</th>
                                <th class="text-end" style="width: 150px;">ფინალური (<span th:text="${maxFinal}"></span>)</th>
                                <th class="text-end">ჯამი</th>
                                <th class="text-center">შეფასება</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="gradeDto, stat : *{grades}">
                                <td th:text="${stat.count}"></td>
                                <td>
                                    <span th:text="${gradeDto.studentName}"></span>
                                    <input type="hidden" th:field="*{grades[__${stat.index}__].studentId}" />
                                    <input type="hidden" th:field="*{grades[__${stat.index}__].attendanceScore}" />
                                </td>
                                <td class="text-end text-info fw-bold" th:text="${#numbers.formatDecimal(gradeDto.attendanceScore, 1, 2)}"></td>
                                <td>
                                    <input type="number" step="0.1" min="0" th:max="${maxMidterm}" class="table-input" 
                                           th:field="*{grades[__${stat.index}__].midtermScore}" />
                                </td>
                                <td>
                                    <input type="number" step="0.1" min="0" th:max="${maxFinal}" class="table-input" 
                                           th:field="*{grades[__${stat.index}__].finalScore}" />
                                </td>
                                <td class="text-end text-success fw-bold" th:text="${#numbers.formatDecimal(gradeDto.getTotalScore(), 1, 2)}"></td>
                                <td class="text-center">
                                    <span class="badge bg-primary" th:text="${gradeDto.getLetterGrade()}"></span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(form.grades)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    სტუდენტები არ მოიძებნა ამ ჯგუფში
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary btn-animated px-4">
                        <i class="bi bi-save"></i> შენახვა
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
