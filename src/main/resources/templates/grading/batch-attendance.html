<!DOCTYPE html>
<html lang="ka" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>დასწრების და შეფასების უწყისი</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
    <style>
        .table-input {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            width: 100%;
        }
        .table-input:focus {
            outline: none;
            border-color: #bb86fc;
            background-color: #333;
        }
        .status-select {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div th:replace="~{common/nav :: nav-bar}"></div>

<div class="container py-4 page-content">
    <div th:if="${errorMessage}" class="alert alert-danger alert-animated">
        <p th:text="${errorMessage}" class="mb-0"></p>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-animated">
        <p th:text="${successMessage}" class="mb-0"></p>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 animate-fade-in-down">
        <div>
            <h2 class="fw-bold">
                <i class="bi bi-ui-checks icon-animated"></i> დასწრების და შეფასების უწყისი
            </h2>
            <p class="text-muted mb-0">
                <span th:text="${schedule.lecture.subject}"></span> |
                <span th:text="${#temporals.format(schedule.date, 'yyyy-MM-dd')}"></span>
                <span th:text="${#temporals.format(schedule.startTime, 'HH:mm')}"></span> - 
                <span th:text="${#temporals.format(schedule.endTime, 'HH:mm')}"></span>
            </p>
        </div>
        <a th:href="@{/attendance/review/{id}(id=${schedule.id})}" class="btn btn-outline-secondary btn-animated">
            <i class="bi bi-arrow-left"></i> უკან დაბრუნება
        </a>
    </div>

    <div class="card card-animated animate-fade-in-up">
        <div class="card-body">
            <form th:action="@{/grading/attendance/save}" th:object="${batchDto}" method="post">
                <input type="hidden" th:field="*{scheduleId}" />
                
                <div class="table-responsive">
                    <table class="table table-dark table-striped table-hover align-middle mb-4">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>სტუდენტი</th>
                                <th>ჯგუფი</th>
                                <th>სტატუსი</th>
                                <th style="width: 150px;">
                                    ქულა (მაქს. <input type="number" id="globalMaxScore" class="form-control form-control-sm d-inline-block w-50" th:value="${maxScorePerWeek}" onchange="updateMaxScores(this.value)">)
                                </th>
                                <th>შენიშვნა</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="studentDto, stat : *{students}">
                                <td th:text="${stat.count}"></td>
                                <td>
                                    <!-- Find the user name from eligibleStudents by id -->
                                    <span th:each="u : ${eligibleStudents}" th:if="${u.id == studentDto.studentId}" th:text="${u.name}"></span>
                                    <input type="hidden" th:field="*{students[__${stat.index}__].studentId}" />
                                </td>
                                <td>
                                    <span th:each="u : ${eligibleStudents}" th:if="${u.id == studentDto.studentId}" th:text="${u.studentGroup != null ? u.studentGroup.code : '-'}"></span>
                                </td>
                                <td>
                                    <select class="form-select status-select" th:field="*{students[__${stat.index}__].status}">
                                        <option th:each="s : ${statuses}" 
                                                th:value="${s}" 
                                                th:text="${s.name() == 'PRESENT' ? 'დაესწრო' : (s.name() == 'ABSENT' ? 'გააცდინა' : 'საპატიო')}">
                                        </option>
                                    </select>
                                </td>
                                <td>
                                    <input type="number" step="0.5" min="0" th:max="${maxScorePerWeek}" class="table-input score-input" 
                                           th:field="*{students[__${stat.index}__].score}" />
                                </td>
                                <td>
                                    <input type="text" class="table-input" placeholder="შენიშვნა..." 
                                           th:field="*{students[__${stat.index}__].note}" />
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(batchDto.students)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    სტუდენტები არ მოიძებნა
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary btn-animated px-4">
                        <i class="bi bi-save"></i> შენახვა
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function updateMaxScores(newValue) {
        let scoreInputs = document.querySelectorAll('.score-input');
        scoreInputs.forEach(input => {
            input.setAttribute('max', newValue);
            // If currently typed score is greater than new max, warn or adjust
            if (parseFloat(input.value) > parseFloat(newValue)) {
                input.value = newValue;
            }
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
