<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User :: Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" th:fragment="header">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/login}">
            <i class="bi bi-calendar-check-fill"></i> დასწრების აპი
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>
<br />
<br />
<br />
<div class="container">
    <div class="row col-md-8 offset-md-2">
        <div class="card">
            <div th:if="${param.success}">
                <div class="alert alert-info">თქვენ წარმატებით გაიარეთ რეგისტრაცია
                   </div>
            </div>
            <div class="card-header">
                <h2 class="text-center">
                    <i class="bi bi-person-plus-fill"></i> რეგისტრაცია
                </h2>
            </div>
            <div class="card-body">
                <form method="post" role="form" th:action="@{/register/save}" th:object="${user}" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{username}" th:value="${user.email}"/>
                    <div th:replace="~{common/userForm :: login-form}"></div>
                    

                    <div class="form-group mb-3 text-center">
                        <div class="col-md-6 offset-md-3"> <!-- bootstrap-ის grid class -->
                            <button class="btn btn-primary btn-block" type="submit">
                                <i class="bi bi-person-plus"></i> რეგისტრაცია
                            </button>
                        </div>
                        <span>უკვე დარეგისტრირებული ხართ? <a th:href="@{/login}">შედით აქ</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    function makePasswordRequiredOnLoad() {
        var field = document.getElementById("password");
        field.required = true;
    }
    window.onload = makePasswordRequiredOnLoad;
</script>

</body>
</html>
